<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From America LLC — Software, literally from America.</title>
<meta name="description" content="Software, literally from America. An independent studio making apps for iPhone and tools for the web.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="ticker" aria-hidden="true"><div class="ticker__track" id="ticker"></div></div>

  <div class="masthead__body">
    <h1 class="wordmark">FROM<span class="wordmark__br"></span>AMERICA</h1>
    <nav class="masthead__nav">
      <button class="link" id="play-all" type="button">Supercut</button>
      <a class="link" href="/about">About</a>
    </nav>
  </div>
</header>

<main class="wall" id="wall" aria-label="Clips"></main>

<div class="sentinel" id="sentinel" aria-hidden="true"></div>

<p class="empty" id="empty" hidden>Nothing here yet.</p>

<button class="sound" id="sound" type="button" hidden>Sound off &mdash; click anywhere</button>

<div class="theater" id="theater" hidden role="dialog" aria-modal="true" aria-label="Player">
  <button class="theater__close" id="theater-close" type="button" aria-label="Close">Close</button>
  <video id="theater-video" playsinline></video>
  <div class="theater__meta">
    <p class="theater__said" id="theater-said"></p>
    <p class="theater__src" id="theater-src"></p>
    <div class="theater__nav">
      <button id="theater-prev" type="button">Prev</button>
      <button id="theater-pause" type="button">Pause</button>
      <button id="theater-next" type="button">Next</button>
      <a id="theater-link" href="#" target="_blank" rel="noopener">Source</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
